server:
  port: 8080

spring:
  application:
    name: hefesto-backend
  # ---------------------------------------------------------------------------
  # Servidor MCP (Model Context Protocol) — Spring AI 1.0.x, starter webmvc.
  # Expõe as tools de com.hefesto.mcp via SSE: GET /sse e POST /mcp/message.
  # Clientes stdio (Claude Code/Desktop) conectam via proxy `mcp-remote`.
  # ---------------------------------------------------------------------------
  ai:
    mcp:
      server:
        name: hefesto-mcp
        version: 0.1.0
        type: SYNC
        instructions: >-
          Hefesto expõe múltiplos modelos de LLM (locais .gguf via llama-server,
          Claude Code, Gemini e outros). Use 'list_models' para descobrir os ids
          disponíveis e 'chat' para conversar com um modelo específico.
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    # Carrega application-local.yml se existir (gitignored, contém credenciais).
    # 'optional:' impede falha caso o arquivo não exista (ex: rodando em CI).
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      enabled: true
      # 5 MB cobre screenshots PNG/JPG e logs típicos. Anexos de TXT
      # continuam limitados a 500KB pelo AttachmentStore.
      max-file-size: 5MB
      max-request-size: 6MB
  # ---------------------------------------------------------------------------
  # Persistência local (SQLite) — Etapa 7
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:sqlite:${HEFESTO_DB_PATH:./hefesto.db}
    driver-class-name: org.sqlite.JDBC
    # SQLite single-writer; manter pool pequeno e timeout generoso pra evitar
    # SQLITE_BUSY em picos de telemetria + chat simultâneos.
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Defaults seguros — sobrescritos por application-local.yml ou env vars.

# Pasta com os arquivos .md dos agentes. Veja agentes/README.md.
# Procurada relativa ao CWD e também um nível acima (caso rode em hefesto-backend/).
agents:
  path: ${AGENTS_PATH:./agentes}

claude:
  cli:
    # Caminho pro binário do Claude Code CLI. Configure em application-local.yml.
    path: ${CLAUDE_CLI_PATH:claude}

jira:
  url: ${JIRA_URL:}
  email: ${JIRA_EMAIL:}
  token: ${JIRA_TOKEN:}

# -----------------------------------------------------------------------------
# Modelos locais (.gguf de E:\LLM) servidos por instâncias do llama-server
# (llama.cpp), uma porta por modelo. Cada entrada vira um adapter selecionável
# e um destino da tool MCP 'chat'. Suba os llama-server com o script
# scripts/start-llama-servers (na raiz do repo) antes de usar.
# -----------------------------------------------------------------------------
hefesto:
  local-models:
    - id: llama-3.1-8b
      display-name: "Llama 3.1 8B (local)"
      base-url: http://localhost:8081
      model: llama-3.1-8b
      timeout-seconds: 180
    - id: mistral-7b
      display-name: "Mistral 7B v0.3 (local)"
      base-url: http://localhost:8082
      model: mistral-7b
      timeout-seconds: 180
    - id: qwen3-8b
      display-name: "Qwen3 8B (local)"
      base-url: http://localhost:8083
      model: qwen3-8b
      timeout-seconds: 180

logging:
  level:
    root: INFO
    com.hefesto: DEBUG
