server:
  port: 8080

spring:
  application:
    name: hefesto-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    # Carrega application-local.yml se existir (gitignored, contém credenciais).
    # 'optional:' impede falha caso o arquivo não exista (ex: rodando em CI).
    import: optional:classpath:application-local.yml

# Defaults seguros — sobrescritos por application-local.yml ou env vars.
claude:
  cli:
    path: C:\Users\Jonnas\AppData\Roaming\npm\claude.cmd

jira:
  url: ${JIRA_URL:}
  email: ${JIRA_EMAIL:}
  token: ${JIRA_TOKEN:}

logging:
  level:
    root: INFO
    com.hefesto: DEBUG
