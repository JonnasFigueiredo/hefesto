server:
  port: 8080

spring:
  application:
    name: hefesto-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  config:
    # Carrega application-local.yml se existir (gitignored, contém credenciais).
    # 'optional:' impede falha caso o arquivo não exista (ex: rodando em CI).
    import: optional:classpath:application-local.yml
  servlet:
    multipart:
      enabled: true
      # 5 MB cobre screenshots PNG/JPG e logs típicos. Anexos de TXT
      # continuam limitados a 500KB pelo AttachmentStore.
      max-file-size: 5MB
      max-request-size: 6MB
  # ---------------------------------------------------------------------------
  # Persistência local (SQLite) — Etapa 7
  # ---------------------------------------------------------------------------
  datasource:
    url: jdbc:sqlite:${HEFESTO_DB_PATH:./hefesto.db}
    driver-class-name: org.sqlite.JDBC
    # SQLite single-writer; manter pool pequeno e timeout generoso pra evitar
    # SQLITE_BUSY em picos de telemetria + chat simultâneos.
    hikari:
      maximum-pool-size: 4
      connection-timeout: 30000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

# Defaults seguros — sobrescritos por application-local.yml ou env vars.

# Pasta com os arquivos .md dos agentes. Veja agentes/README.md.
# Procurada relativa ao CWD e também um nível acima (caso rode em hefesto-backend/).
agents:
  path: ${AGENTS_PATH:./agentes}

claude:
  cli:
    # Caminho pro binário do Claude Code CLI. Configure em application-local.yml.
    path: ${CLAUDE_CLI_PATH:claude}

jira:
  url: ${JIRA_URL:}
  email: ${JIRA_EMAIL:}
  token: ${JIRA_TOKEN:}

logging:
  level:
    root: INFO
    com.hefesto: DEBUG
